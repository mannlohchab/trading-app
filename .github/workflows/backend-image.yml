# Builds the backend image, publishes it to GHCR, then asks Dokploy to roll it out.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - 'elysia-backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

concurrency:
  group: backend-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trading-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        working-directory: elysia-backend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: elysia-backend
        run: bun run typecheck

      - name: Check Dokploy environment parsing
        working-directory: elysia-backend
        run: python3 deploy/validate-environment.py

      # These checks use in-memory PostgreSQL and do not require worker namespaces.
      - name: Check HTTP health and migrations
        working-directory: elysia-backend
        run: bun test tests/health.test.ts tests/http.test.ts tests/schema.test.ts tests/backtesting/sandbox-startup.test.ts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: elysia-backend
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ vars.DOKPLOY_DEPLOY_PAUSED != 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy Compose pulls :latest and waits for container health before completing deployment.
      - name: Trigger Dokploy deploy
        if: vars.DOKPLOY_DEPLOY_PAUSED != 'true'
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; production deployment cannot proceed."
            exit 1
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"push_data":{"tag":"latest"},"repository":{"repo_name":"${{ env.IMAGE }}"}}'

      - name: Verify production revision
        if: vars.DOKPLOY_DEPLOY_PAUSED != 'true'
        env:
          BACKEND_PUBLIC_URL: ${{ vars.BACKEND_PUBLIC_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          if [ -z "$BACKEND_PUBLIC_URL" ]; then
            echo "BACKEND_PUBLIC_URL is required to verify production."
            exit 1
          fi
          base="${BACKEND_PUBLIC_URL%/}"
          for attempt in $(seq 1 60); do
            version="$(curl -fsS --connect-timeout 5 --max-time 10 "$base/health/version" 2>/dev/null || true)"
            if printf '%s' "$version" | jq -e --arg revision "$EXPECTED_REVISION" '.framework == "elysia" and .revision == $revision' >/dev/null 2>&1; then
              if curl -fsS --connect-timeout 5 --max-time 10 "$base/health/ready" | jq -e '.ok == true and .database == "up"' >/dev/null; then
                echo "Production is ready at revision $EXPECTED_REVISION."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Production did not become ready at the expected revision."
          exit 1

      - name: Report paused deployment
        if: vars.DOKPLOY_DEPLOY_PAUSED == 'true'
        run: echo 'Release image published with its commit tag. Production deployment and the latest tag are paused by DOKPLOY_DEPLOY_PAUSED.' >> "$GITHUB_STEP_SUMMARY"
