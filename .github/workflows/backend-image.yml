# Builds the backend image, publishes it to GHCR, then asks Dokploy to roll it out.
name: Backend image

on:
  push:
    branches: [main]
    paths:
      - 'elysia-backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

concurrency:
  group: backend-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/trading-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        working-directory: elysia-backend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: elysia-backend
        run: bun run typecheck

      # These checks use in-memory PostgreSQL and do not require worker namespaces.
      - name: Check HTTP health and migrations
        working-directory: elysia-backend
        run: bun test tests/health.test.ts tests/http.test.ts tests/schema.test.ts tests/backtesting/sandbox-startup.test.ts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: elysia-backend
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ vars.DOKPLOY_DEPLOY_PAUSED != 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy pulls :latest; rollout order and rollback policy are configured on its service.
      - name: Trigger Dokploy deploy
        if: vars.DOKPLOY_DEPLOY_PAUSED != 'true'
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set; image published without deploying."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"push_data":{"tag":"latest"},"repository":{"repo_name":"${{ env.IMAGE }}"}}'

      - name: Report paused deployment
        if: vars.DOKPLOY_DEPLOY_PAUSED == 'true'
        run: echo 'Release image published with its commit tag. Production deployment and the latest tag are paused by DOKPLOY_DEPLOY_PAUSED.' >> "$GITHUB_STEP_SUMMARY"
