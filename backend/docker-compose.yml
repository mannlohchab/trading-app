# Local development database: `bun run db:up` (Postgres 17 on localhost:5433)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      # Host port 5433: 5432 is often taken by a system Postgres.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
